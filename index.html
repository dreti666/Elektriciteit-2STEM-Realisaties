<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektriciteit stap voor stap</title>
<meta name="theme-color" content="#003000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elektriciteit">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --card:#FFFFFF; --ink:#1E2A2E; --muted:#5A6468; --line:#D9D5CB;
  --groen:#2E7D4F; --groen-bg:#E3F2E8; --blauw:#1F5FA8; --blauw-bg:#E4EEF9;
  --oranje:#A35A00; --oranje-bg:#FDF0DC; --geel:#FFD43B;
  --fs:19px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Lexend','Segoe UI','Segoe UI Symbol','DejaVu Sans',Arial,sans-serif;font-size:var(--fs);line-height:1.6;letter-spacing:.01em}
body.groot{--fs:23px}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .titel{font-weight:600;flex:1;font-size:1.05em}
.ikoon{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:52px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.ikoon:hover{border-color:var(--blauw)}
.ikoon svg{width:26px;height:26px}
main{max-width:860px;margin:0 auto;padding:18px 14px 80px}
h1{font-size:1.5em;margin:.2em 0 .4em;font-weight:600}
h2{font-size:1.25em;margin:.2em 0 .5em;font-weight:600}
.kaart{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mod{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;min-height:96px;width:100%}
.mod:hover{border-color:var(--blauw)}
.mod .nr{flex-shrink:0;width:64px;height:64px;border-radius:14px;background:var(--blauw-bg);display:flex;align-items:center;justify-content:center}
.mod .nr svg{width:50px;height:50px}
.mod .naam{font-weight:600;line-height:1.3}
.mod .sub{font-size:.8em;color:var(--muted)}
.sterren{color:#C98A00;font-size:.9em;letter-spacing:2px}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 22px;border-radius:16px;border:2px solid var(--blauw);background:var(--card);color:var(--blauw);font-weight:600}
.knop.vol{background:var(--blauw);color:#fff}
.knop svg{width:24px;height:24px;flex-shrink:0}
.knop:disabled{opacity:.45;cursor:default}
.knoppen{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:16px}
.tabs{display:flex;gap:10px;margin:6px 0 16px}
.tab{flex:1;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:600}
.tab.aan{border-color:var(--blauw);background:var(--blauw-bg);color:var(--blauw)}
.voortgang{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.voortgang span{height:10px;flex:1;min-width:14px;border-radius:5px;background:var(--line)}
.voortgang span.klaar{background:var(--groen)}
.voortgang span.nu{background:var(--blauw)}
.stap{font-size:.85em;color:var(--muted)}
.lees{display:flex;align-items:flex-start;gap:12px}
.lees .tekst{flex:1}
.lees p{margin:.35em 0}
.spreek{flex-shrink:0;min-width:52px;min-height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center}
.spreek svg{width:26px;height:26px}
.beeld{display:flex;justify-content:center;margin:10px 0}
.beeld svg{max-width:100%;height:auto}
.woord{background:var(--oranje-bg);color:var(--oranje);border-radius:6px;padding:0 4px;font-weight:600}
.opties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.optie{min-height:64px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left;display:flex;align-items:center;gap:12px}
.optie:hover{border-color:var(--blauw)}
.optie svg{width:110px;height:auto;flex-shrink:0}
.optie.goed{border-color:var(--groen);background:var(--groen-bg)}
.optie.fout{border-color:var(--line);background:#EFEDE8;color:var(--muted);text-decoration:line-through}
.optie.gekozen{border-color:var(--blauw);background:var(--blauw-bg)}
.optie:disabled{cursor:default}
.situatie{background:var(--blauw-bg);border-radius:16px;padding:16px 18px;font-size:1.1em;font-weight:600;margin-top:8px}
.melding{border-radius:16px;padding:14px 18px;margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.melding.goed{background:var(--groen-bg);color:#1E5636}
.melding.bijna{background:var(--oranje-bg);color:#6E3D00}
.melding svg{width:28px;height:28px;flex-shrink:0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.match .kol{display:flex;flex-direction:column;gap:10px}
.match .optie{justify-content:center;text-align:center;flex-direction:column}
.match .optie svg{width:120px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:2px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{font-weight:600}
.zelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.groot-getal{font-size:2.2em;font-weight:600}
.lijst-woord{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:2px solid var(--line)}
.lijst-woord .pic{width:84px;flex-shrink:0;display:flex;justify-content:center}
.lijst-woord .pic svg{width:84px;height:auto}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.schakel button{min-width:110px}
input[type=text]{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;width:100%;max-width:420px;background:#fff}
.klein{font-size:.85em;color:var(--muted)}
.tag{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:8px;background:var(--blauw-bg);color:var(--blauw);margin:2px 4px 2px 0}
.hulp{border:2px dashed var(--line);border-radius:16px;padding:12px 16px;margin-top:12px}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:4px solid #F0A500;outline-offset:2px}
@keyframes draai{to{transform:rotate(360deg)}}
.top .logo{height:38px;width:auto;border-radius:6px}
.merk{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.merk .stem{height:96px;width:auto;max-width:100%}
.merk .school{height:60px;width:auto}
.maker{font-size:.85em;color:var(--muted);margin-top:8px}
.voet{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:36px 0 0;padding-top:14px;border-top:2px solid var(--line);font-size:.8em;color:var(--muted);text-align:center}
.voet img{height:30px;width:auto}
.ekaart{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:3px solid #E8B100;border-radius:18px;padding:12px 14px;margin-bottom:14px}
.ekaart svg{width:150px;height:auto;flex-shrink:0;border-radius:10px}
.ekaart .sub{font-size:.8em;color:var(--muted)}.ekaart .naam{font-weight:600;font-size:1.15em}
.ew-kop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ew-tabs{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto}.ew-tabs .tab{min-width:110px;white-space:nowrap;padding:0 10px}
.ew-raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tegel{border-radius:14px;padding:10px 14px;background:var(--card);border:2px solid var(--line)}
.tegel .l{font-size:.78em;color:var(--muted)}.tegel .w{font-size:1.4em;font-weight:600;line-height:1.2}
.tegel.zon{border-color:#E8B100;background:#FFF8DC}.tegel.wind{border-color:#5BA3D9;background:#EAF5FC}.tegel.verb{border-color:#B9B4A8}
.tegel.bat{border-color:#2E9B3A;background:#EEF7EF}.tegel.in{border-color:var(--groen);background:var(--groen-bg)}.tegel.af{border-color:#D08A2A;background:var(--oranje-bg)}
.toestel{display:flex;align-items:center;gap:10px;text-align:left;min-height:62px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);width:100%}
.toestel.aan{border-color:var(--groen);background:var(--groen-bg)}.toestel .i{width:38px;height:38px;flex-shrink:0}.toestel .i svg{width:38px;height:38px}
.toestel .n{font-weight:600;line-height:1.25}.toestel .p{font-size:.8em;color:var(--muted)}
.toestel .s{margin-left:auto;font-size:.8em;font-weight:600;padding:2px 8px;border-radius:8px;background:#EFEDE8}.toestel.aan .s{background:var(--groen);color:#fff}
.ew-meter{background:#F2C230;border:2px solid #6b5200;border-radius:18px;padding:12px;max-width:340px;margin:10px auto}
.ew-meter .scherm{background:#CFE3C4;border:2px solid #333;border-radius:10px;padding:8px 12px;font-family:'Courier New',monospace;font-weight:700}
.ew-meter .scherm div{display:flex;justify-content:space-between;font-size:1.25em}.ew-meter .waar{font-size:.8em;margin-top:8px;color:#3a2c00}
.ew-code{display:flex;gap:10px;justify-content:center;margin:12px 0}
.ew-code span{width:54px;height:66px;border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:600;background:#fff}
.ew-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.ew-pad button{min-height:60px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.4em;font-weight:600}
.ew-pad .ok{background:var(--blauw);color:#fff;border-color:var(--blauw)}
.melding.info{background:var(--blauw-bg);color:#123F70}
.woning svg{width:100%;height:auto;display:block;border-radius:16px}
input[type=range]{width:100%;height:36px}
@keyframes waai{to{stroke-dashoffset:-120}}
.windlijn{stroke-dasharray:40 80;animation:waai linear infinite}body.rustig .windlijn{animation:none}
@media (max-width:560px){.ew-tabs .tab{min-width:0;font-size:.8em;padding:0 6px}.merk .stem{height:70px}.merk .school{height:46px}.ekaart{flex-direction:column}.ekaart svg{width:100%}}

body.rustig *{transition:none!important;animation:none!important}
@media (max-width:520px){.top .kort{display:none}.top .titel{font-size:.9em;line-height:1.25}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== DONKER THEMA in schoolkleuren (St.-Jozef Schoten) ===== */
:root{
  --bg:#0B0F0D; --card:#161C33; --card2:#1D2545; --ink:#F2F4F8; --muted:#AEB7CC; --line:#323C6B;
  --schoolgroen:#003000; --schoolblauw:#262C56; --accent:#7ED957; --geel:#F2D53C;
  --groen:#7ED957; --groen-bg:#123D1E; --blauw:#8EB0FF; --blauw-bg:#222C5C;
  --oranje:#FFC857; --oranje-bg:#3A2C08;
}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg) radial-gradient(1200px 500px at 50% -200px,#0F2A16 0%,transparent 70%) no-repeat}
.top{background:var(--schoolgroen);border-bottom:3px solid var(--accent);padding:8px 14px}
.top .logo{height:42px;background:#fff;padding:3px 6px;border-radius:8px}
.top .titel{color:#fff;font-size:1em;line-height:1.2}
.top .titel small{display:block;color:var(--accent);font-weight:500;font-size:.72em;letter-spacing:.04em}
main{padding-bottom:120px}
.kaart{background:var(--card);border-color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.mod{background:var(--card);border-color:var(--line)}
.mod:hover,.optie:hover,.ikoon:hover{border-color:var(--accent)}
.mod .nr{background:#EEF3FF}
.mod .sub{color:var(--accent)}
.sterren{color:var(--geel)}
.knop{background:transparent;border-color:var(--blauw);color:var(--blauw)}
.knop.vol{background:var(--accent);border-color:var(--accent);color:#06200C}
.tab{background:var(--card);border-color:var(--line);color:var(--ink)}
.tab.aan{background:var(--blauw);border-color:var(--blauw);color:#0B1433}
.voortgang span{background:#2A3359}
.voortgang span.nu{background:var(--geel)}
.spreek{background:var(--card2);border-color:var(--line);color:var(--ink)}
.spreek svg{stroke:var(--ink)}
.optie{background:var(--card2);border-color:var(--line);color:var(--ink)}
.optie.goed{border-color:var(--accent);background:var(--groen-bg)}
.optie.fout{background:#20242F;color:#7D859A;border-color:#2A3047}
.optie.gekozen{border-color:var(--blauw);background:var(--blauw-bg)}
/* tekeningen en schema's altijd op een wit paneel: zo blijven symbolen en draadkleuren juist */
.beeld{background:#fff;border-radius:16px;padding:12px;color:#1E2A2E}
.optie>svg,.optie>img,.match .optie>svg,.match .optie>img{background:#fff;border-radius:10px;padding:6px;color:#1E2A2E}
.lijst-woord .pic{background:#fff;border-radius:12px;padding:4px}
.ekaart svg{background:#fff}
.hulp .beeld{background:#fff}
.situatie{background:var(--blauw-bg);color:#fff}
.beeld .situatie{color:#1E2A2E;background:#E4EEF9}
.woord{background:var(--oranje-bg);color:var(--oranje)}
.melding.goed{background:var(--groen-bg);color:#D6F7DC}
.melding.bijna{background:var(--oranje-bg);color:#FFE7A6}
.melding.info{background:var(--blauw-bg);color:#E3EBFF}
.melding svg{color:inherit}
td,th{border-color:var(--line)}
th{color:var(--accent)}
.hulp{border-color:var(--blauw)}
.tag{background:var(--blauw-bg);color:#DCE6FF}
input[type=text]{background:#0E1430;color:var(--ink);border-color:var(--line)}
.ikoon{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.voet{border-color:var(--line)}
.voet img{background:#fff;padding:2px 4px;border-radius:6px}
.merk{background:#fff;color:#1E2A2E}
.merk .maker{color:#3B4650}
.ekaart{background:var(--card);border-color:var(--geel)}
.ekaart .sub{color:var(--geel)}
.tegel{background:var(--card2);border-color:var(--line)}
.tegel.zon{background:#3A3008;border-color:#E8B100}.tegel.wind{background:#0F2D44;border-color:#5BA3D9}
.tegel.bat{background:#123D1E;border-color:#2E9B3A}.tegel.in{background:var(--groen-bg)}.tegel.af{background:var(--oranje-bg)}
.toestel{background:var(--card2);border-color:var(--line)}
.toestel .s{background:#2A3359;color:var(--ink)}.toestel.aan .s{background:var(--accent);color:#06200C}
.ew-meter,.ew-meter .scherm{color:#1a1a1a}
.ew-code span{background:#0E1430;border-color:var(--line);color:#fff}
.ew-pad button{background:var(--card2);border-color:var(--line);color:#fff}
.ew-pad .ok{background:var(--accent);border-color:var(--accent);color:#06200C}
/* niveaus */
.niveaus{display:grid;gap:12px}
.niveau{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:84px;padding:12px 16px;border-radius:18px;border:3px solid var(--line);background:var(--card)}
.niveau .nivnr{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4em;flex-shrink:0;color:#06200C}
.niveau .nivtekst{flex:1;display:flex;flex-direction:column;line-height:1.35}
.niveau.n1{border-color:#7ED957}.niveau.n1 .nivnr{background:#7ED957}
.niveau.n2{border-color:#8EB0FF}.niveau.n2 .nivnr{background:#8EB0FF}
.niveau.n3{border-color:#F2D53C}.niveau.n3 .nivnr{background:#F2D53C}
.sterren .klein{letter-spacing:0}
.niveau.dicht{opacity:.55;border-style:dashed;cursor:default}
.nivlabel{display:inline-block;font-weight:600;padding:1px 10px;border-radius:10px;margin-right:6px;color:#06200C}
.nivlabel.n1{background:#7ED957}.nivlabel.n2{background:#8EB0FF}.nivlabel.n3{background:#F2D53C}
.nivbol{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.nivbol i{font-style:normal;font-size:.62em;font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);color:var(--muted)}
.nivbol i.half{border-color:var(--blauw);color:var(--blauw)}
.nivbol i.vol{background:var(--accent);border-color:var(--accent);color:#06200C}
/* onderste navigatie */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--schoolblauw);border-top:3px solid var(--accent);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:#DCE3FF;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;font-size:.72em;font-weight:500;border-radius:12px}
.nav button svg{width:26px;height:26px}
.nav button.aan{background:rgba(126,217,87,.16);color:var(--accent)}
:focus-visible{outline-color:var(--geel)}

@media (min-width:900px){.nav{left:50%;right:auto;width:860px;transform:translateX(-50%);border:3px solid var(--accent);border-bottom:0;border-radius:18px 18px 0 0}}
</style>
</head>

<div id="toast" role="status" style="display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:92%;width:520px;background:#262C56;color:#fff;border:2px solid #7ED957;padding:14px 18px;border-radius:14px;font-size:.9em;z-index:20"></div>

<script>
/* ---------- opslag ---------- */
const KEY='elek-app-v1';
let S={naam:'',groot:false,rustig:false,spreek:true,res:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function bewaar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pasToe(){document.body.classList.toggle('groot',!!S.groot);document.body.classList.toggle('rustig',!!S.rustig);}
pasToe();

/* ---------- voorlezen ---------- */
let stemmen=[],alleStemmen=[];
const kanSpreken=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function laadStemmen(){try{alleStemmen=speechSynthesis.getVoices();stemmen=alleStemmen.filter(v=>/^nl/i.test(v.lang));if(V&&V.view==='instellingen')rerender();}catch(e){}}
try{if(kanSpreken){laadStemmen();speechSynthesis.addEventListener('voiceschanged',laadStemmen);}}catch(e){}
function score(v){let p=0;if(/natural|online|neural/i.test(v.name))p+=4;if(/google/i.test(v.name))p+=2;if(/nl-BE/i.test(v.lang))p+=1;return p;}
function gekozenStem(){
  if(!stemmen.length)return null;
  return stemmen.find(v=>v.name===S.stem)||stemmen.slice().sort((a,b)=>score(b)-score(a))[0];
}
function toast(t){const el=document.getElementById('toast');if(!el)return;el.innerHTML=t;el.style.display='block';clearTimeout(toast.tm);toast.tm=setTimeout(()=>{el.style.display='none';},6000);}
function spreek(t){
  if(!kanSpreken){toast('Voorlezen werkt niet in deze browser. Probeer Microsoft Edge of Google Chrome.');return;}
  try{
    if(!stemmen.length)laadStemmen();
    const tekst=t.replace(/Ω/g,' ohm ').replace(/V⎓/g,'V gelijkspanning').replace(/V~/g,'V wisselspanning').replace(/1″/g,'1 accent').replace(/mm²/g,'vierkante millimeter').replace(/m\/s/g,'meter per seconde').replace(/km\/u/g,'kilometer per uur').replace(/kWh/g,'kilowattuur').replace(/W\/m²/g,'watt per vierkante meter').replace(/Wp\b/g,'wattpiek').replace(/(\d) W\b/g,'$1 watt').replace(/(\d) V\b/g,'$1 volt').replace(/(\d) A\b/g,'$1 ampère');
    const delen=tekst.match(/[^.!?]+[.!?]*/g)||[tekst];
    speechSynthesis.cancel();
    const v=gekozenStem();
    if(!v)toast('Er is geen Nederlandse stem gevonden op dit toestel. De tekst wordt misschien met een andere stem voorgelezen. Kijk bij Instellingen.');
    setTimeout(()=>{
      try{speechSynthesis.resume();}catch(e){}
      delen.forEach((d,n)=>{const u=new SpeechSynthesisUtterance(d.trim());u.lang=v?v.lang:'nl-BE';u.rate=.9;if(v)u.voice=v;
        u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Voorlezen lukte niet ('+e.error+'). Kijk bij Instellingen.');};
        speechSynthesis.speak(u);});
    },80);
  }catch(e){toast('Voorlezen lukte niet. Kijk bij Instellingen.');}
}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
const HMM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6"/><path d="M12 17h.01"/></svg>';
function spreekKnop(t){return S.spreek?`<button class="spreek" data-act="spreek" data-t="${esc(t)}" aria-label="Voorlezen">${SPK}</button>`:'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function kaal(s){return String(s).replace(/<[^>]+>/g,'');}

/* ---------- tekeningen ---------- */
const W='#2B2B2B';
function picto(w=120){return `<svg width="${w}" viewBox="0 0 100 90" role="img" aria-label="Pictogram gevaar elektrische spanning"><polygon points="50,6 95,84 5,84" fill="#FFD43B" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/><path d="M56,26 L38,56 H50 L44,76 L64,44 H52 Z" fill="#1a1a1a"/></svg>`;}
function sym(t,w=150){
  const s=`stroke="${W}" stroke-width="3" fill="none" stroke-linecap="round"`;
  let g='';
  if(t==='batterij')g=`<line x1="8" y1="30" x2="52" y2="30" ${s}/><line x1="52" y1="10" x2="52" y2="50" ${s}/><line x1="64" y1="20" x2="64" y2="40" stroke="${W}" stroke-width="7"/><line x1="66" y1="30" x2="112" y2="30" ${s}/><text x="40" y="16" font-size="14" fill="${W}">+</text>`;
  if(t==='lamp')g=`<line x1="8" y1="30" x2="42" y2="30" ${s}/><circle cx="60" cy="30" r="18" ${s}/><line x1="47" y1="17" x2="73" y2="43" ${s}/><line x1="73" y1="17" x2="47" y2="43" ${s}/><line x1="78" y1="30" x2="112" y2="30" ${s}/>`;
  if(t==='schakelaar')g=`<line x1="8" y1="30" x2="38" y2="30" ${s}/><circle cx="40" cy="30" r="3" fill="${W}"/><line x1="40" y1="30" x2="78" y2="12" ${s}/><circle cx="80" cy="30" r="3" fill="${W}"/><line x1="82" y1="30" x2="112" y2="30" ${s}/>`;
  if(t==='motor')g=`<line x1="8" y1="30" x2="42" y2="30" ${s}/><circle cx="60" cy="30" r="18" ${s}/><text x="60" y="37" font-size="20" text-anchor="middle" fill="${W}" font-family="Arial">M</text><line x1="78" y1="30" x2="112" y2="30" ${s}/>`;
  if(t==='zekering')g=`<line x1="8" y1="30" x2="112" y2="30" ${s}/><rect x="36" y="20" width="48" height="20" ${s}/>`;
  if(t==='weerstand')g=`<line x1="8" y1="30" x2="36" y2="30" ${s}/><rect x="36" y="20" width="48" height="20" ${s}/><line x1="84" y1="30" x2="112" y2="30" ${s}/>`;
  if(t==='draad')g=`<line x1="8" y1="30" x2="112" y2="30" ${s}/>`;
  return `<svg width="${w}" viewBox="0 0 120 60" role="img" aria-label="Symbool ${t}">${g}</svg>`;
}
let pid=0;
function draad(kleur,w=170){
  pid++;
  const k={bruin:'#7B4A2A',zwart:'#1E1E1E',grijs:'#8E8E8E',blauw:'#2C6FD1',geelgroen:'url(#gg'+pid+')',rood:'#C83A2E'}[kleur];
  return `<svg width="${w}" viewBox="0 0 170 40" role="img" aria-label="Draad ${kleur}"><defs><pattern id="gg${pid}" width="24" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="12" height="40" fill="#F2D400"/><rect x="12" width="12" height="40" fill="#2E9B3A"/></pattern></defs><rect x="4" y="10" width="140" height="20" rx="10" fill="${k}" stroke="#333" stroke-width="1.5"/><rect x="144" y="16" width="22" height="8" rx="2" fill="#C8763A"/></svg>`;
}
function kabel(w=230){return `<svg width="${w}" viewBox="0 0 230 150" role="img" aria-label="Doorsnede van een kabel"><circle cx="75" cy="75" r="60" fill="#D7D7D7" stroke="#555" stroke-width="2"/><circle cx="75" cy="75" r="28" fill="#C8763A" stroke="#7a3f12" stroke-width="2"/><line x1="100" y1="62" x2="150" y2="40" stroke="#333" stroke-width="2"/><text x="152" y="44" font-size="15" fill="#333">koper</text><line x1="125" y1="105" x2="150" y2="118" stroke="#333" stroke-width="2"/><text x="152" y="124" font-size="15" fill="#333">kunststof</text></svg>`;}
function mm(sel,disp,w=200){

function lampT(cx,cy,st){

  let r='';
  if(st==='aan'){for(let i=0;i<8;i++){const a=i*Math.PI/4;r+=`<line x1="${cx+Math.cos(a)*19}" y1="${cy+Math.sin(a)*19}" x2="${cx+Math.cos(a)*27}" y2="${cy+Math.sin(a)*27}" stroke="#E89B00" stroke-width="3" stroke-linecap="round"/>`;}}
  const f=st==='aan'?'#FFC929':st==='zwak'?'#FFE9A3':'#fff';
  return `${r}<circle cx="${cx}" cy="${cy}" r="14" fill="${f}" stroke="${W}" stroke-width="3"/><line x1="${cx-10}" y1="${cy-10}" x2="${cx+10}" y2="${cy+10}" stroke="${W}" stroke-width="2.5"/><line x1="${cx+10}" y1="${cy-10}" x2="${cx-10}" y2="${cy+10}" stroke="${W}" stroke-width="2.5"/>`;

const BR='#7B4A2A',BL='#2C6FD1',ZW='#1E1E1E';
function ln(x1,y1,x2,y2,c,w=3){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;}
function dot(x,y){return `<circle cx="${x}" cy="${y}" r="4" fill="${W}"/>`;}
function cont(x1,x2,y,dicht){return dot(x1,y)+dot(x2,y)+(dicht?ln(x1,y,x2,y,W,4):ln(x1,y,x2-6,y-24,W,4));}
function wis(cx,y,dir,onder){const tx=cx+40*dir;return dot(cx,y)+dot(tx,y-20)+dot(tx,y+20)+ln(cx,y,tx,onder?y+20:y-20,W,4);}
function lampV(x,y1,y2,on,cy){cy=cy||115;return ln(x,y1,x,cy-14,ZW)+lampT(x,cy,on?'aan':'uit')+ln(x,cy+14,x,y2,BL);}
function txt(x,y,t,anchor,c){return `<text x="${x}" y="${y}" font-size="12" text-anchor="${anchor||'middle'}" fill="${c||'#555'}">${t}</text>`;}
function huisAan(type,s){
  if(type==='enkel'||type==='dubbel')return [!!s.s];
  if(type==='serie')return [!!s.a,!!s.b];
  if(type==='wissel')return [!!s.w1===!!s.w2];
  if(type==='kruis'){const p=s.w1?1:0;const q=s.k?1-p:p;return [q===(s.w2?1:0)];}
  return [false];
}

function windTekening(n){

function teken(kind,s,inter){
  if(kind==='enkel')return kEnkel(s,inter);
  if(kind==='serie')return kSerie(s,inter);
  if(kind==='par')return kPar(s,inter);
  if(kind==='led')return kLed(s,inter);
  if(kind==='u3')return kU3(s,inter);
  if(kind==='u1')return kU1(s,inter);
  if(kind.startsWith('huis:'))return kHuis(kind.slice(5),s,inter);
  return '';
}
function vis(x,w){
  if(typeof x!=='string')return x;
  if(x.startsWith('sym:'))return sym(x.slice(4),w||120);
  if(x.startsWith('esym:'))return eSym(x.slice(5),w?w*0.7:84);
  if(x==='ledsym')return ledSym(w||120);
  if(x.startsWith('img:'))return `<img src="${B[x.slice(4)]}" alt="symbool" style="height:${Math.round((w||120)*0.75)}px;width:auto">`;
  return '<b>'+x+'</b>';
}

function jdot(x,y,c){return `<circle cx="${x}" cy="${y}" r="5" fill="${c}"/>`;}

/* spanning, stroom, weerstand en vermogen in het schema */
const TST=[{n:'lamp',W:23,I:0.1,R:2300},{n:'strijkijzer',W:1150,I:5,R:46},{n:'waterkoker',W:2300,I:10,R:23},{n:'verwarming',W:2300,I:10,R:23}];
function fmt(x){return String(Math.round(x*10)/10).replace('.',',');}
function toestel(x,y,t,aan){
  if(TST[t].n==='lamp')return {g:lampT(x,y,aan?'aan':'uit'),top:y-14,bot:y+14};
  return {g:`<rect x="${x-11}" y="${y-20}" width="22" height="40" fill="${aan?'#FFD9C7':'#fff'}" stroke="${W}" stroke-width="3"/>`,top:y-20,bot:y+20};
}
function pijlOmlaag(x,y){return `<polygon points="${x-7},${y-6} ${x+7},${y-6} ${x},${y+6}" fill="${RD}"/>`;}
function kU1(s,inter,meter){
  const H=235,yb=210,x=170,t=s.t||0,on=!!s.s,T=TST[t];
  let g=rails(H)+jdot(x,30,RD)+ln(x,30,x,60,RD)+contV(x,66,100,on,'S1');
  let y0=100;
  if(meter==='A'){g+=ln(x,100,x,112,ZW)+`<circle cx="${x}" cy="126" r="14" fill="#fff" stroke="${W}" stroke-width="3"/><text x="${x}" y="131" font-size="15" font-weight="700" text-anchor="middle" fill="${W}">A</text>`;y0=140;}
  const d=toestel(x,165,t,on);
  g+=ln(x,y0,x,d.top,ZW)+d.g+ln(x,d.bot,x,yb,BL)+jdot(x,yb,BL)+lbl(x-30,162,'E1')+klein(x-30,178,T.n+' '+T.W+' W','end');
  if(meter==='V'){const mx=x+70;g+=jdot(x,145,W)+jdot(x,190,W)+ln(x,145,mx,145,W,2.5)+ln(mx,145,mx,153,W,2.5)+`<circle cx="${mx}" cy="167" r="14" fill="#fff" stroke="${W}" stroke-width="3"/><text x="${mx}" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="${W}">V</text>`+ln(mx,181,mx,190,W,2.5)+ln(mx,190,x,190,W,2.5);}
  else{g+=ln(300,40,300,yb-10,'#1F5FA8',2.5)+`<polygon points="294,46 306,46 300,36" fill="#1F5FA8"/><polygon points="294,${yb-16} 306,${yb-16} 300,${yb-6}" fill="#1F5FA8"/>`+`<text x="292" y="114" font-size="13" font-weight="700" text-anchor="end" fill="#1F5FA8">U =</text><text x="292" y="130" font-size="13" font-weight="700" text-anchor="end" fill="#1F5FA8">230 V</text>`;}
  if(on)g+=pijlOmlaag(x,46)+pijlOmlaag(x,yb-12)+`<text x="${x+10}" y="52" font-size="13" font-weight="700" fill="${RD}">I = ${fmt(T.I)} A</text>`;
  else g+=`<text x="${x+10}" y="52" font-size="13" font-weight="700" fill="#888">I = 0 A</text>`;
  return `<svg width="100%" style="max-width:380px" viewBox="0 0 340 ${H}" role="img" aria-label="Stroomkringschema met S1 en ${T.n} E1. ${on?'S1 is dicht, er loopt '+fmt(T.I)+' ampère.':'S1 is open, er loopt geen stroom.'}${meter==='A'?' Er staat een ampèremeter in de draad.':meter==='V'?' Er staat een voltmeter naast E1.':''}">${g}${inter?hit(x-20,52,60,56,'s','Schakelaar S1 omzetten'):''}</svg>`;
}

function kU3(s,inter){

  let h='';
  U3.forEach(([x,k,i],n)=>{const aan=!!s[k]&&!trip;const d=toestel(x,145,i,aan);

}

  const d=dir;const v=up?-6:6;
  return `<line x1="${xm}" y1="${y}" x2="${xm+d*6}" y2="${y}" stroke="${ZW}" stroke-width="2.5" stroke-dasharray="3 2"/>`
   +`<polyline points="${xm+d*6},${y} ${xm+d*9},${y+v} ${xm+d*12},${y}" fill="none" stroke="${ZW}" stroke-width="2.5"/>`
   +`<line x1="${xm+d*12}" y1="${y}" x2="${xm+d*17}" y2="${y}" stroke="${ZW}" stroke-width="2.5" stroke-dasharray="3 2"/>`
   +ln(xm+d*18,y-8,xm+d*18,y+8,ZW,3);
}
/* enkelvoudig contact zoals in de les: vaste stomp boven, hefboom scharniert onderaan en kantelt naar links */
function contV(x,y1,y2,dicht,label,metHand){
  const L=y2-y1,tx=dicht?x:x-Math.round(L*0.45),ty=dicht?y1:y1+3;
  const mx=(x+tx)/2,my=(y1+y2)/2+2;
  let g=ln(x,y1-12,x,y1,ZW,4)+ln(x,y2,tx,ty,ZW,4);
  if(metHand!==false&&label!==null)g+=hand(mx-2,my,-1,false);
  if(label)g+=`<text x="${mx-(metHand===false?10:26)}" y="${my+6}" font-size="16" text-anchor="end" fill="${ZW}">${label}</text>`;
  return g;
}
function railsLes(H,boven,onder,x0){x0=x0||118;const yb=H-22;
  return ln(x0,34,330,34,RD,4)+ln(x0,yb,330,yb,BL,4)
   +boven.map((t,i)=>`<text x="8" y="${30+i*18}" font-size="15" fill="${RD}">${t}</text>`).join('')
   +`<text x="8" y="${yb+5}" font-size="15" fill="${BL}">${onder}</text>`;}
function rails(H){return railsLes(H,['Lijndraad /','Fasedraad +'],'Nuldraad  −');}
function lampL(x,y,on,r){r=r||15;
  let rays='';if(on){for(let i=0;i<8;i++){const a=i*Math.PI/4;rays+=ln(x+Math.cos(a)*(r+5),y+Math.sin(a)*(r+5),x+Math.cos(a)*(r+12),y+Math.sin(a)*(r+12),'#E89B00',3);}}
  const k=r*0.7;
  return rays+`<circle cx="${x}" cy="${y}" r="${r}" fill="${on?'#FFC929':'#fff'}" stroke="${ZW}" stroke-width="3.5"/>`+ln(x-k,y-k,x+k,y+k,ZW,3)+ln(x+k,y-k,x-k,y+k,ZW,3);}
function etk(x,y,t,anchor){return `<text x="${x}" y="${y}" font-size="16" text-anchor="${anchor||'end'}" fill="${ZW}">${t}</text>`;}
function kl(x,y,t,anchor){return `<text x="${x}" y="${y}" font-size="13" text-anchor="${anchor||'start'}" fill="${ZW}">${t}</text>`;}
function kHuis(type,s,inter){
  const on=huisAan(type,s);
  if(type==='kruis')return kruisPanel(s,inter,[]);
  let g='',h='',H=250;
  if(type==='enkel'){H=250;const x=220,yb=H-22;
    g=rails(H)+jdot(x,34,RD)+ln(x,34,x,80,RD,4)+contV(x,92,128,s.s,'S1')+ln(x,128,x,150,ZW,4)+lampL(x,165,on[0])+etk(x-20,171,'E1')+ln(x,180,x,200,ZW,4)+ln(x,200,x,yb,BL,4)+jdot(x,yb,BL);
    h=hit(x-60,74,90,64,'s','Schakelaar S1 omzetten');}
  if(type==='dubbel'){H=320;const x=210,yb=H-22;
    g=railsLes(H,['Fase draad +'],'Neuter draad −')+jdot(x,34,RD)+ln(x,34,x,58,RD,4)+contV(x,70,98,s.s,'S1')+ln(x,98,x,108,ZW,4)+jdot(x,108,ZW)
      +ln(x,108,x,118,ZW,4)+lampL(x,131,on[0],12)+etk(x-18,137,'E1')+ln(x,143,x,156,ZW,4)+lampL(x,168,on[0],12)+etk(x-18,174,'E2')+ln(x,180,x,194,ZW,4)+jdot(x,194,ZW)
      +ln(x,108,x+52,108,ZW,4)+ln(x+52,108,x+52,138,ZW,4)+lampL(x+52,150,on[0],12)+etk(x+70,156,'E3','start')+ln(x+52,162,x+52,194,ZW,4)+ln(x+52,194,x,194,ZW,4)
      +ln(x,194,x,212,ZW,4)+contV(x,224,252,s.s,'S1',false)+ln(x,252,x,272,ZW,4)+ln(x,272,x,yb,BL,4)+jdot(x,yb,BL);
    h=hit(x-60,56,90,52,'s','Schakelaar S1 omzetten')+hit(x-60,210,90,52,'s','Schakelaar S1 omzetten');}
  if(type==='serie'){H=250;const yb=H-22;
    g=rails(H)+jdot(200,34,RD)+ln(200,34,200,56,RD,4)+ln(200,56,200,72,ZW,4)+jdot(200,72,ZW)+ln(200,72,262,72,ZW,4)+ln(262,72,262,80,ZW,4)+ln(200,72,200,80,ZW,4);
    [[200,'a','E1','end',-20,'S1'],[262,'b','E2','start',20,'']].forEach(([x,k,e,an,dx,lab],i)=>{
      g+=contV(x,92,128,s[k],lab)+ln(x,128,x,150,ZW,4)+lampL(x,165,on[i])+etk(x+dx,171,e,an)+ln(x,180,x,200,ZW,4)+ln(x,200,x,yb,BL,4)+jdot(x,yb,BL);
      h+=hit(x-36,74,58,64,k,(i?'Rechtse':'Linkse')+' knop van S1 omzetten');});}
  if(type==='wissel'){H=345;const yb=H-22,x=200;
    g=ln(118,34,330,34,RD,4)+ln(118,yb,330,yb,BL,4)+`<text x="20" y="44" font-size="17" font-weight="700" fill="${RD}">L</text><text x="20" y="${yb+6}" font-size="17" font-weight="700" fill="${BL}">N</text>`
      +jdot(x,34,RD)+ln(x,34,x,52,RD,4)+ln(x,52,x,72,ZW,4)+kl(x+8,66,'L');
    /* S1: scharnier boven (L), contact 1 rechts (haakvormig), contact 1″ links */
    g+=ln(x-14,98,x+12,98,ZW,4)+ln(x+12,98,x+12,190,ZW,4)+ln(x-24,100,x-24,190,ZW,4)+kl(x-30,128,'1″','end')+kl(x+20,128,'1');
    g+=s.w1?ln(x,72,x+10,110,ZW,4):ln(x,72,x-22,100,ZW,4);
    const m1=s.w1?[x+5,90]:[x-11,86];g+=hand(m1[0],m1[1],1,true)+`<text x="${x+50}" y="94" font-size="16" font-weight="700" fill="${ZW}">S1</text>`;
    /* S2: contact 1 links (haakvormig), contact 1″ rechts, scharnier onder (L) */
    g+=ln(x-24,190,x-24,232,ZW,4)+ln(x-24,232,x+2,232,ZW,4)+ln(x+12,190,x+12,234,ZW,4)+kl(x-30,214,'1','end')+kl(x+20,214,'1″');
    g+=s.w2?ln(x,268,x+12,234,ZW,4):ln(x,268,x-12,222,ZW,4);
    const m2=s.w2?[x+6,251]:[x-6,245];g+=hand(m2[0],m2[1],-1,false)+kl(x-14,284,'L','end')+`<text x="${x+50}" y="252" font-size="16" font-weight="700" fill="${ZW}">S2</text>`;
    g+=ln(x,268,x,281,ZW,4)+kl(x+10,280,'+')+lampL(x,296,on[0],14)+`<text x="${x+50}" y="302" font-size="16" font-weight="700" fill="${ZW}">E1</text>`+ln(x,310,x,yb-6,ZW,4)+kl(x+10,318,'−')+ln(x,yb-6,x,yb,BL,4)+jdot(x,yb,BL);
    h=hit(x-40,64,80,56,'w1','Wisselschakelaar S1 omzetten')+hit(x-40,212,80,62,'w2','Wisselschakelaar S2 omzetten');}
  const desc=on.length>1?`E1 ${on[0]?'brandt':'brandt niet'}, E2 ${on[1]?'brandt':'brandt niet'}.`:`De lamp ${on[0]?'brandt':'brandt niet'}.`;
  return `<svg width="100%" style="max-width:380px" viewBox="0 0 340 ${H}" role="img" aria-label="Stroomkringschema. ${desc}">${g}${inter?h:''}</svg>`;
}
function huisStatus(type,s){
  const on=huisAan(type,s);
  if(type==='serie')return `E1 ${on[0]?'<b>brandt</b>':'brandt niet'}. E2 ${on[1]?'<b>brandt</b>':'brandt niet'}.`;
  if(type==='dubbel')return on[0]?'E1, E2 en E3 <b>branden</b>.':'De lampen branden <b>niet</b>.';
  return `E1 ${on[0]?'<b>brandt</b>':'brandt <b>niet</b>'}.`;
}
function kruisPanel(s,inter,vast){
  const on=huisAan('kruis',s)[0];vast=vast||[];
  const knop=(k,naam,a,b)=>{const dis=!inter||vast.includes(k);return `<button class="optie ${s[k]?'gekozen':''}" data-act="kring" data-k="${k}" ${dis?'disabled':''} style="flex-direction:column;justify-content:center;text-align:center"><b>${naam}</b><span class="klein">${s[k]?b:a}</span>${dis&&inter?'<span class="klein">(vast)</span>':''}</button>`;};
  return `<div style="width:100%">${imgB('kru_skk',240,'Stroomkringschema kruisschakeling uit de les')}
  <p class="klein" style="text-align:center;margin:6px 0 0">Tik op S1, S2 of S3 om de stand te wisselen.</p>
  <div class="opties" style="grid-template-columns:repeat(3,1fr)">${knop('w1','S1 wissel','stand 1″','stand 1')}${knop('k','S2 kruis','recht door','gekruist')}${knop('w2','S3 wissel','stand 1″','stand 1')}</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px"><svg width="54" viewBox="0 0 54 54">${lampL(27,27,on,15)}</svg><b>E1 ${on?'brandt':'brandt niet'}</b></div></div>`;
}

  {titel:'Het stroomkringschema',beeld:()=>imgB('dub_skk',380,'Stroomkringschema dubbelpolige schakeling uit de les'),tekst:['S1 staat twee keer in het schema: één contact in de fasedraad, één in de neuter.','Beide contacten heten S1. Ze bewegen samen.','S1 bedient de lampgroep E1, E2 en E3.']},
  {titel:'Probeer zelf',demo:'huis:dubbel',tekst:['Tik op S1. Kijk: beide contacten bewegen.']},
  {titel:'Het leidingschema',beeld:()=>imgB('dub_lei',540,'Leidingschema dubbelpolige schakeling uit de les'),tekst:['Naar S1 gaan 4 draden.','Naar de lampen: 3 (2+PE): 2 draden en de aarding.']},

{id:'dubbele',hfst:'huis',titel:'Serieschakelaar (dubbele aansteking)',lpd:['LPD 4','LPD 14'],ico:'h_serie',
 leren:[
  {titel:'Wat is het?',tekst:['Eén schakelaar met <b>2 knoppen</b> bedient <b>2 lampen</b> of lampgroepen apart.','Zo bedien je met weinig plaats 2 lichtgroepen vanaf 1 plaats.','Bijvoorbeeld in een leefruimte, een gang of een garage.','Niet geschikt als je de lampen vanaf meerdere plaatsen wil bedienen.']},
  {titel:'De aansluitklemmen',tekst:['Een serieschakelaar heeft <b>3 klemmen</b>.','<b>L1</b>: de bruine fasedraad.','<b>1</b>: zwarte schakeldraad naar lampgroep 1 (E1).','<b>2</b>: zwarte schakeldraad naar lampgroep 2 (E2).','De nuldraad gaat rechtstreeks naar de lampen.']},
  {titel:'Het stroomkringschema',beeld:()=>imgB('ser_skk',440,'Stroomkringschema serieschakelaar uit de les'),tekst:['De fasedraad gaat naar beide knoppen van S1.','De linkse knop stuurt E1. De rechtse knop stuurt E2.']},
  {titel:'Sleutelprincipe',arei:true,tekst:['De serieschakelaar onderbreekt alleen de fasedraad. Nooit de nuldraad.']},
  {titel:'Probeer zelf',demo:'huis:serie',tekst:['Tik op de linkse en op de rechtse knop.']},
  {titel:'Het leidingschema',beeld:()=>imgB('ser_lei',540,'Leidingschema serieschakelaar uit de les'),tekst:['Naar S1: 3 draden: L+S+S.','Naar elk lichtpunt: 3 draden: S+N+A.']},
  {titel:'Het bedradingschema',beeld:()=>imgB('ser_bed',480,'Bedradingschema serieschakelaar uit de les'),tekst:['Hier zie je welke draad op welke klem komt: L1, 1 en 2.']},
  {titel:'Eenlijnig symbool',beeld:()=>imgB('s_serie',70,'Eenlijnig symbool'),tekst:['Zo teken je deze schakelaar op het leidingschema.']}
 ],

  {titel:'De aansluitklemmen',tekst:['Een wisselschakelaar heeft <b>3 klemmen</b>: <b>L</b>, <b>1</b> en <b>1″</b>.','Op S1: klem L = de bruine fasedraad.','Klem 1 en 1″: de 2 schakeldraden naar S2.','Op S2: klem L = de schakeldraad naar de lamp.']},
  {titel:'Het stroomkringschema',beeld:()=>imgB('wis_skk',460,'Stroomkringschema wisselschakeling uit de les'),tekst:['S1 krijgt de fasedraad. Van S1 lopen 2 schakeldraden (1 en 1″) naar S2.','S2 geeft de stroom door naar de lamp E1.','Staan S1 en S2 op dezelfde draad? Dan brandt E1.']},
  {titel:'Probeer zelf',demo:'huis:wissel',tekst:['Tik op S1 en op S2.','Met elke schakelaar kan je E1 aan- en uitzetten.']},
  {titel:'Kleuren van de schakeldraden',tekst:['Geef klem 1 en 1″ een andere kleur. Dan zie je ze makkelijk.','Wissel je 1 en 1″ om? Dan verandert alleen de stand van de knoppen.','<b>Nooit</b> voor een schakeldraad: bruin/rood, blauw of geel-groen.']},
  {titel:'Het leidingschema',beeld:()=>imgB('wis_lei',540,'Leidingschema wisselschakeling uit de les'),tekst:['Naar S1, E1 en S2: telkens 3 draden.','Tussen de twee dozen: 4 draden.']},
  {titel:'Het bedradingschema',beeld:()=>imgB('wis_bed',480,'Bedradingschema wisselschakeling uit de les'),tekst:['Hier zie je welke draad op welke klem komt: L, 1 en 1″.']},

  {titel:'Het leidingschema',beeld:()=>imgB('kru_lei',540,'Leidingschema kruisschakeling uit de les'),tekst:['S1 en S3: wisselschakelaars. S2: de kruisschakelaar.','De cijfers tonen het aantal draden: 3 of 4.']},

function mod(id){return MODS.find(m=>m.id===id);}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function vragenVan(m,niv){
  const out=[];
  m.oef.filter(q=>!niv||q.niv===niv).forEach(q=>{
    if(q.type==='sort'){q.items.forEach(([t,b,u])=>out.push({type:'mc',vraag:q.vraag,kaart:t,opties:q.bakken,juist:b,vast:true,uitleg:u||''}));}
    else if(q.type==='mc'&&!q.vast){const idx=shuffle(q.opties.map((_,i)=>i));out.push(Object.assign({},q,{opties:idx.map((i,p)=>typeof q.opties[i]==='string'?q.opties[i]:Object.assign({},q.opties[i],{t:'ABCDEF'[p]})),juist:idx.indexOf(q.juist)}));}
    else if(q.type==='match'){out.push(Object.assign({},q,{rechts:shuffle(q.paren.map((p,i)=>i))}));}
    else out.push(Object.assign({},q));
  });
  return out;
}
function sterren(p){return p>=.9?3:p>=.7?2:p>=.5?1:0;}
function sterTekst(n){return '★'.repeat(n)+'☆'.repeat(3-n);}

MODS.forEach(m=>{if(OEF[m.id])m.oef=OEF[m.id];});


function nivRes(m,n){const r=S.res[m.id];return r&&r.niv&&r.niv[n]||null;}
function nivOpen(m,n){if(n===1||S.allesOpen)return true;const r=nivRes(m,n-1);return !!(r&&r.best>=.7);}
function nivKeuze(m){
  const uitleg={1:'Basisvragen. Herkennen en kiezen.',2:'Toepassen. Iets meer nadenken.',3:'Uitdaging. Rekenen en verklaren.'};
  let h=`<div class="kaart"><div class="lees"><div class="tekst"><h2>Kies je niveau</h2><p>Begin bij <b>Gemakkelijk</b>. Haal je 70% of meer? Dan gaat het volgende niveau open.</p></div>${spreekKnop('Kies je niveau. Begin bij Gemakkelijk. Haal je 70 procent of meer? Dan gaat het volgende niveau open.')}</div></div><div class="niveaus">`;
  NIVEAUS.forEach(([n,naam])=>{const open=nivOpen(m,n),r=nivRes(m,n),aantal=m.oef.filter(q=>q.niv===n).length;
    h+=`<button class="niveau n${n} ${open?'':'dicht'}" data-act="niv" data-n="${n}" ${open?'':'disabled'}><span class="nivnr">${n}</span><span class="nivtekst"><b>${naam}</b><span class="klein">${open?uitleg[n]+' · '+aantal+' vragen':'Op slot. Haal eerst 70% op '+NIVEAUS[n-2][1]+'.'}</span></span><span class="sterren">${open?(r?sterTekst(sterren(r.best)):'<span class="klein">nieuw</span>'):'🔒'}</span></button>`;});
  return h+`</div>`;
}
function nivBolletjes(m){return `<span class="nivbol">${NIVEAUS.map(([n,naam])=>{const r=nivRes(m,n);return `<i class="${r&&r.best>=.7?'vol':r?'half':''}" title="${naam}">${naam[0]}</i>`;}).join('')}</span>`;}

function render(){
  const a=document.getElementById('app');
  const f={home,module:moduleView,woorden,instellingen,resultaten,leraar,energie:()=>EW.view()}[V.view]||home;
  a.innerHTML=f()+(V.view==='energie'?'':voet());
  window.scrollTo(0,0);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('aan',b.dataset.v===V.view||(b.dataset.v==='home'&&['module','energie','leraar'].includes(V.view))));
}
function rerender(){const y=window.scrollY;const a=document.getElementById('app');const f={home,module:moduleView,woorden,instellingen,resultaten,leraar,energie:()=>EW.view()}[V.view];a.innerHTML=f()+(V.view==='energie'?'':voet());window.scrollTo(0,y);}

function energieKaart(){return `<button class="ekaart" data-act="go" data-v="energie"><svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#9FD3F5"/><circle cx="26" cy="24" r="12" fill="#FFD43B"/><rect y="80" width="160" height="20" fill="#7CB65A"/><rect x="40" y="52" width="66" height="30" fill="#F3E3C3" stroke="#8a7650"/><polygon points="34,54 52,32 94,32 112,54" fill="#B5523B"/><polygon points="50,50 58,36 90,36 98,50" fill="#23407A"/><rect x="128" y="30" width="3" height="52" fill="#9AA3AB"/><path d="M120,14 Q128,24 136,34 M136,14 Q128,24 120,34" stroke="#555" stroke-width="3" fill="none"/></svg><span><span class="sub">Simulatie</span><br><span class="naam">De energiewoning</span><br><span class="klein">Zonnepanelen, windturbine, thuisbatterij en het net. Je leraar kiest het weer.</span></span></button>`;}
function home(){
  let h=`<div class="kaart merk"><img class="stem" src="${LOGO.stem}" alt="STEM Realisaties"><img class="school" src="${LOGO.school}" alt="Logo van de school"><div style="flex-basis:100%" class="maker">Gemaakt door <b>Timmy De Rechter</b>, klastitularis 2B STEM Realisaties</div></div>
  <h1>${S.naam?'Hallo '+esc(S.naam)+'!':'Hallo!'}</h1>
  <div class="lees kaart"><div class="tekst"><p>Hier leer je de basis van elektriciteit.</p><p>Kies een onderwerp. Eerst <b>leren</b>, dan <b>oefenen</b>.</p><p class="klein">Je mag alles zo vaak doen als je wil.</p></div>${spreekKnop('Hier leer je de basis van elektriciteit. Kies een onderwerp. Eerst leren, dan oefenen. Je mag alles zo vaak doen als je wil.')}</div>
  `;
  let nr=0;
  HFST.forEach(([hid,hnaam])=>{
  h+=`<h2 style="margin-top:1.2em">${hnaam}</h2>${hid==='energie'?energieKaart():''}<div class="raster">`;
  MODS.filter(m=>m.hfst===hid).forEach((m)=>{const i=nr++;
    const r=S.res[m.id];
    h+=`<button class="mod" data-act="mod" data-id="${m.id}"><span class="nr">${ico(m.ico)}</span><span><span class="sub">Stap ${i+1}</span><br><span class="naam">${m.titel}</span><br><span class="sterren" aria-label="${r?sterren(r.best)+' van 3 sterren':'nog niet geoefend'}">${r?sterTekst(sterren(r.best)):'<span class="klein">nog niet geoefend</span>'}</span> ${nivBolletjes(m)}</span></button>`;
  });
  h+=`</div>`;});
  h+=`<div class="knoppen" style="justify-content:flex-start"><button class="knop" data-act="go" data-v="resultaten">Mijn resultaten</button><button class="knop" data-act="go" data-v="leraar">Voor de leraar</button></div>`;
  return h;
}

function moduleView(){
  const m=mod(V.mod);
  let h=`<h1>${m.titel}</h1><div class="tabs"><button class="tab ${V.tab==='leren'?'aan':''}" data-act="tab" data-t="leren">1. Leren</button><button class="tab ${V.tab==='oef'?'aan':''}" data-act="tab" data-t="oef">2. Oefenen</button></div>`;
  return h+(V.tab==='leren'?lerenView(m):V.niv?oefView(m):nivKeuze(m));
}
function balk(n,i){let s='<div class="voortgang" aria-hidden="true">';for(let k=0;k<n;k++)s+=`<span class="${k<i?'klaar':k===i?'nu':''}"></span>`;return s+'</div>';}

function lerenView(m){
  const i=V.kaart,c=m.leren[i];
  const tekst=(c.tekst||[]).map(t=>`<p>${t}</p>`).join('');
  let extra='';
  if(c.beeld)extra+=`<div class="beeld">${c.beeld()}</div>`;
  if(c.lijst)extra+=c.lijst.map(([s,n])=>`<div class="lijst-woord"><div class="pic">${vis(s,110)}</div><div><b>${n}</b></div></div>`).join('');
  if(c.tabel)extra+=`<table>${c.tabel.map((r,k)=>'<tr>'+r.map(x=>k?`<td>${x}</td>`:`<th>${x}</th>`).join('')+'</tr>').join('')}</table>`;
  if(c.demo==='enkel')extra+=`<div class="beeld">${kEnkel(V.demo,true)}</div><p class="klein" style="text-align:center">De lamp ${V.demo.sw?'<b>brandt</b>':'brandt <b>niet</b>'}. De kring is ${V.demo.sw?'gesloten':'open'}.</p>`;
  if(c.demo==='serie')extra+=`<div class="beeld">${kSerie(V.demo,true)}</div><p class="klein" style="text-align:center">${!V.demo.l1?'Lamp 1 is eruit. De kring is open. Alles is uit.':V.demo.sw?'Beide lampen branden, maar zwak.':'De schakelaar is open.'}</p>`;
  if(c.demo==='par')extra+=`<div class="beeld">${kPar(V.demo,true)}</div>`;
  if(c.demo&&c.demo.startsWith('huis:')){extra+=`<div class="beeld">${kHuis(c.demo.slice(5),V.demo,true)}</div><p class="klein" style="text-align:center">${huisStatus(c.demo.slice(5),V.demo)} Tik op een schakelaar.</p>`;}
  if(c.demo==='led'){extra+=`<div class="beeld">${kLed(V.demo,true)}</div><p class="klein" style="text-align:center">${!V.demo.om&&!V.demo.weg?'De led brandt.':V.demo.om?'De led zit verkeerd om. Hij brandt niet.':'Zonder weerstand: te veel stroom. De led is kapot.'}</p>`;}
  if(c.demo==='ohm'){const U=V.demo.U,R=V.demo.R,I=U/R;const knop=(k,v,e)=>`<button class="optie ${V.demo[k]===v?'gekozen':''}" data-act="demo" data-k="${k}" data-v="${v}" style="justify-content:center;font-weight:600">${v} ${e}</button>`;
    extra+=`<p><b>Spanning U</b></p><div class="opties" style="grid-template-columns:repeat(3,1fr)">${[6,12,24].map(v=>knop('U',v,'V')).join('')}</div><p><b>Weerstand R</b></p><div class="opties" style="grid-template-columns:repeat(3,1fr)">${[2,3,6].map(v=>knop('R',v,'Ω')).join('')}</div>
    <div class="beeld"><svg width="120" viewBox="0 0 60 60">${lampT(30,30,I>=6?'aan':I>=2?'zwak':'uit')}</svg></div><div class="situatie" style="text-align:center">I = U : R = ${U} : ${R} = ${Math.round(I*10)/10} A</div>`;}
  if(c.demo==='u1'){const T=TST[V.demo.t],aan=V.demo.s;extra+=`<div class="beeld">${kU1(V.demo,true)}</div><div class="opties" style="grid-template-columns:repeat(3,1fr)">${[0,1,2].map(k=>`<button class="optie ${V.demo.t===k?'gekozen':''}" data-act="demo" data-k="t" data-v="${k}" style="justify-content:center;flex-direction:column;text-align:center"><b>${TST[k].n}</b><span class="klein">${TST[k].W} W</span></button>`).join('')}</div>
    <table style="margin-top:12px"><tr><td>Spanning U</td><td><b>230 V</b></td><td class="klein">altijd, tussen L en N</td></tr><tr><td>Stroom I</td><td><b>${aan?fmt(T.I):'0'} A</b></td><td class="klein">${aan?'S1 is dicht':'S1 is open: geen stroom'}</td></tr><tr><td>Vermogen P</td><td><b>${aan?T.W:0} W</b></td><td class="klein">staat op het toestel</td></tr><tr><td>Weerstand R</td><td><b>${T.R} Ω</b></td><td class="klein">${T.R>1000?'groot: weinig stroom':'klein: veel stroom'}</td></tr></table>`;}
  if(c.demo==='u3'){extra+=`<div class="beeld">${kU3(V.demo,true)}</div><p class="klein" style="text-align:center">Tik op S1, S2 en S3.</p>${u3Tekst(V.demo)}`;}
  if(c.demo==='zon'){const n=V.demo.zon;extra+=`<div class="beeld">${zonTekening(n)}</div><div class="opties" style="grid-template-columns:repeat(3,1fr)">${['Nacht','Bewolkt','Zon'].map((t,k)=>`<button class="optie ${n===k?'gekozen':''}" data-act="demo" data-k="zon" data-v="${k}" style="justify-content:center">${t}</button>`).join('')}</div>`;}
  if(c.demo==='wind'){const n=V.demo.wind;extra+=`<div class="beeld">${windTekening(n)}</div><div class="opties" style="grid-template-columns:repeat(2,1fr)">${['Geen wind','Weinig wind','Veel wind','Storm'].map((t,k)=>`<button class="optie ${n===k?'gekozen':''}" data-act="demo" data-k="wind" data-v="${k}" style="justify-content:center">${t}</button>`).join('')}</div>`;}
  if(c.demo==='mm'){const st=V.demo.mm||'OFF';extra+=`<div class="beeld">${mm(st,st==='V⎓'?'9.02':st==='V~'?'---':st==='A'?'0.25':st==='Ω'?'220':'',170)}</div><div class="opties">${Object.keys(MMUITLEG).map(k=>`<button class="optie ${k===st?'gekozen':''}" data-act="mm" data-k="${k}" style="justify-content:center;font-family:'Segoe UI Symbol','DejaVu Sans',Arial;font-weight:600">${k}</button>`).join('')}</div><div class="melding goed" style="background:var(--blauw-bg);color:var(--blauw)"><span><b>${st}</b>: ${MMUITLEG[st]}</span></div>`;}
  const leesTekst=c.titel+'. '+(c.tekst||[]).map(kaal).join(' ')+(c.lijst?' '+c.lijst.map(x=>x[1]).join(', '):'');
  const laatste=i===m.leren.length-1;
  return `<div class="stap">Kaart ${i+1} van ${m.leren.length}</div>${balk(m.leren.length,i)}
  <div class="kaart">${c.arei?'<span class="tag" style="background:#3A2C08;color:#FFC857">AREI</span>':''}<div class="lees"><div class="tekst"><h2>${c.titel}</h2>${tekst}</div>${spreekKnop(leesTekst)}</div>${extra}</div>
  <div class="knoppen"><button class="knop" data-act="kaart" data-d="-1" ${i===0?'disabled':''}>Vorige</button>${laatste?'<button class="knop vol" data-act="tab" data-t="oef">Start met oefenen</button>':'<button class="knop vol" data-act="kaart" data-d="1">Volgende</button>'}</div>`;
}

function hulpkaart(m){
  if(!m.hulp)return '';
  if(!V.hulp)return `<div style="margin-top:14px"><button class="knop" data-act="hulp">Toon de hulpkaart</button></div>`;
  if(m.hulp==='vermogen')return `<div class="hulp"><p>In huis: <b>U = 230 V</b></p><p><b>P = U × I</b> &nbsp;·&nbsp; <b>I = P : U</b></p><table><tr><th>Toestel</th><th>Vermogen</th><th>Stroom</th></tr>${TST.slice(0,3).map(t=>`<tr><td>${t.n}</td><td>${t.W} W</td><td>${fmt(t.I)} A</td></tr>`).join('')}</table><button class="knop" data-act="hulp" style="margin-top:8px">Verberg de hulpkaart</button></div>`;
  if(m.hulp==='ohm')return `<div class="hulp"><div class="beeld">${ohmDriehoek(140)}</div><p><b>U = R × I</b> &nbsp;·&nbsp; <b>I = U : R</b> &nbsp;·&nbsp; <b>R = U : I</b></p><p class="klein">U = spanning (V) · I = stroom (A) · R = weerstand (Ω)</p><button class="knop" data-act="hulp" style="margin-top:8px">Verberg de hulpkaart</button></div>`;
  return `<div class="hulp"><table><tr><th>Grootheid</th><th>Letter</th><th>Eenheid</th><th>Teken</th></tr><tr><td>Spanning</td><td>U</td><td>volt</td><td>V</td></tr><tr><td>Stroom</td><td>I</td><td>ampère</td><td>A</td></tr><tr><td>Weerstand</td><td>R</td><td>ohm</td><td>Ω</td></tr><tr><td>Vermogen</td><td>P</td><td>watt</td><td>W</td></tr></table><p class="klein">V⎓ = gelijkspanning (batterij) · V~ = wisselspanning (stopcontact)</p><button class="knop" data-act="hulp" style="margin-top:8px">Verberg de hulpkaart</button></div>`;
}

function oefView(m){
  const O=V.oef;
  if(O.i>=O.q.length)return eindView(m);
  const q=O.q[O.i];

}

  if(a==='cijfer'){V2.fout=null;if((V2.invoer||'').length<5)V2.invoer=(V2.invoer||'')+n;rrE();return;}
  if(a==='wis'){V2.invoer=(V2.invoer||'').slice(0,-1);rrE();return;}
  if(a==='startcode'){const c=V2.invoer||'';if(c.length<5){V2.fout='Typ 5 cijfers.';rrE();return;}if(!laadCode(c)){V2.fout='Deze code bestaat niet. Kijk nog eens goed.';rrE();return;}ES.code=c;bewaarE();V2.invoer='';V2.oef=null;V2.tab='woning';nieuw();return;}
  if(a==='vrij'){ES.code='80600';laadCode(ES.code);bewaarE();V2.oef=null;V2.tab='woning';nieuw();return;}
  if(a==='vrijbat'){W.bat=W.bat?0:5;W.E=W.bat?BAT.cap/2:0;ES.code=maakCode();bewaarE();rrE();return;}
  if(a==='toestel'){W.aan[k]=!W.aan[k];rrE();return;}
  if(a==='meet'){V2.meet=k;rrE();return;}
  if(a==='tijd'){stap(+el.dataset.m);rrE();return;}
  if(a==='nultellers'){nulTellers();W.E=W.bat?BAT.cap*W.bat/10:0;rrE();return;}
  if(a==='speel'){if(speler){clearInterval(speler);speler=null;rrE();return;}
    if(W.uur>=23){W.uur=0;}
    speler=setInterval(()=>{stap(60);W.uur++;if(W.uur>=23){clearInterval(speler);speler=null;}rrE();},rustigE()?400:900);rrE();return;}
  if(a==='dagnul'){if(speler){clearInterval(speler);speler=null;}W.uur=0;nulTellers();W.E=W.bat?BAT.cap*W.bat/10:0;rrE();return;}
  if(a==='thema'){V2.thema=k;V2.oef=null;nieuw();return;}
  if(a==='anderthema'){V2.oef=null;V2.thema=null;nieuw();return;}
  if(a==='oefToestel'){if(V2.oef.klaar)return;V2.oef.aan[k]=!V2.oef.aan[k];V2.oef.msg=null;rrE();return;}
  if(a==='oefMeet'){V2.oef.meet=k;rrE();return;}
  if(a==='opt'){const O=V2.oef,q=O.q[O.i],c=+k;if(c===q.juist){O.klaar=true;if(O.eerste)O.score++;O.msg={s:'goed',t:'<b>Juist!</b> '+q.uitleg};}else{O.eerste=false;O.fout.push(c);O.msg={s:'bijna',t:'Nog niet juist. Probeer nog eens.'+(q.hulp?' Tip: '+q.hulp:'')};}rrE();return;}
  if(a==='controleer'){const O=V2.oef,q=O.q[O.i];const R=bereken({G:q.G,v:W.v,aan:O.aan});
    if(R.verbr>q.max){O.eerste=false;O.msg={s:'bijna',t:`Het verbruik is ${R.verbr} W. Dat is meer dan de ${q.max} W die opgewekt wordt. Dan neem je stroom van het net. Zet iets uit.`};}
    else if(R.verbr<q.min){O.eerste=false;O.msg={s:'bijna',t:`Het verbruik is ${R.verbr} W. Dat is minder dan ${q.min} W. Zet nog iets aan.`};}
    else{O.klaar=true;if(O.eerste)O.score++;O.msg={s:'goed',t:`<b>Goed zo!</b> Verbruik ${R.verbr} W, opgewekt ${R.prod} W. Er gaat ${R.prod-R.verbr} W naar het net.`};}rrE();return;}
  if(a==='volgende'){const O=V2.oef;O.i++;O.eerste=true;O.fout=[];O.klaar=false;O.msg=null;O.meet='zon';zetAan();
    if(O.i>=O.q.length){const key=ES.code+'-'+O.thema+'-'+O.niv;const r=ES.res[key]||{};ES.res[key]=Object.assign(r,{score:O.score,n:O.q.length,best:Math.max(r.best||0,O.score)});bewaarE();}nieuw();return;}
  if(a==='opnieuw'){startOef(V2.oef.thema,V2.oef.niv);nieuw();return;}
  if(a==='niv'){startOef(V2.thema,+n);nieuw();return;}
  if(a==='nivvolgend'){startOef(V2.oef.thema,V2.oef.niv+1);nieuw();return;}
  if(a==='nivkies'){V2.oef=null;nieuw();return;}
  if(a==='zelf'){const key=ES.code+'-'+V2.oef.thema+'-'+V2.oef.niv;ES.res[key]=Object.assign(ES.res[key]||{},{zelf:k});bewaarE();rrE();return;}
  if(a==='pin'){V2.fout=null;if((V2.pin||'').length<4)V2.pin=(V2.pin||'')+n;rrE();return;}
  if(a==='pinwis'){V2.pin=(V2.pin||'').slice(0,-1);rrE();return;}
  if(a==='pinok'){if(V2.pin===ES.pin){V2.ok=true;V2.fout=null;}else V2.fout='Verkeerde code.';V2.pin='';rrE();return;}
  if(a==='npin'){if((V2.npin||'').length<4)V2.npin=(V2.npin||'')+n;rrE();return;}
  if(a==='npinwis'){V2.npin=(V2.npin||'').slice(0,-1);rrE();return;}
  if(a==='npinok'){if((V2.npin||'').length===4){ES.pin=V2.npin;bewaarE();toast('Nieuwe leraarscode bewaard.');}V2.npin='';rrE();return;}
  if(a==='uitlog'){V2.ok=false;V2.tab='woning';nieuw();return;}
  if(a==='lzon'){W.Gmax=ZON[+n];rrE();return;}
  if(a==='lwindk'){W.v=+n;rrE();return;}
  if(a==='lbat'){W.bat=+n;rrE();return;}
  if(a==='lreeks'){W.reeks=+n;rrE();return;}
  if(a==='gebruik'){const c=maakCode();laadCode(c);ES.code=c;bewaarE();V2.oef=null;V2.ok=false;V2.tab='woning';nieuw();toast('Scenario '+c+' staat klaar.');return;}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ew2]');if(!el)return;const a=el.dataset.ew2;
  if(a==='zon')W.Gmax=ZON[+el.value];if(a==='wind'||a==='lwind')W.v=+el.value;if(a==='uur')W.uur=+el.value;
  if(vrij()&&ES.code&&(a==='zon'||a==='wind')){ES.code=maakCode();bewaarE();}rrE();});
document.addEventListener('input',e=>{const el=e.target.closest('[data-ew2]');if(!el)return;const lab=el.previousElementSibling;if(!lab||lab.tagName!=='LABEL')return;const a=el.dataset.ew2;
  if(a==='zon'){const g=ZON[+el.value];lab.innerHTML=`<b>Zon (middag):</b> ${zonNaam(g)} (${g} W/m²)`;}
  else if(a==='uur')lab.innerHTML=`<b>Uur van de dag:</b> ${el.value}:00`;
  else lab.innerHTML=`<b>Wind:</b> ${el.value} m/s · ${beaufort(+el.value).naam}`;});
/* scenario uit de link */
(function(){const m=location.hash.match(/^#s-(\d{5})$/);if(m&&laadCode(m[1])){ES.code=m[1];bewaarE();}else if(ES.code&&!laadCode(ES.code))ES.code='';})();
function ewOpen(t,n){if(n===1||S.allesOpen)return true;const r=ES.res[ES.code+'-'+t+'-'+(n-1)];return !!(r&&r.n&&r.best/r.n>=.7);}
function resultaten(){return Object.keys(ES.res).map(k=>{const [c,t,n]=k.split('-');const th=(THEMAS.find(x=>x[0]===t)||['',t])[1]+(n?' · '+NIVEAUS[n-1][1]:'');return {code:c,thema:th,...ES.res[k]};});}
return {view,resultaten,heeftLink:()=>/^#s-\d{5}$/.test(location.hash),export:(code,niv,thema)=>{const oud=ES.code;ES.code=code;laadCode(code);const q=vragen(thema,niv);ES.code=oud;if(oud)laadCode(oud);return q;}};
})();

if(EW.heeftLink())V={view:'energie'};
render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
