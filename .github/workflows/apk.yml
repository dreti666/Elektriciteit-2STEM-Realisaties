name: Android-app bouwen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Kopie van de app meegeven (voor gebruik zonder internet)
        run: |
          mkdir -p android/app/src/main/assets
          cp -r elektriciteit android/app/src/main/assets/
          rm -f android/app/src/main/assets/elektriciteit/sw.js
      - name: APK bouwen
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: APK op GitHub zetten (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk elektriciteit.apk
          gh release create "apk-${{ github.run_number }}" elektriciteit.apk \
            --title "Elektriciteit stap voor stap (Android) ${{ github.run_number }}" \
            --notes "Download elektriciteit.apk op een Android-toestel en installeer het bestand." \
            --latest
      - name: APK op de website zetten
        run: |
          mkdir -p download
          cp elektriciteit.apk download/elektriciteit.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add download/elektriciteit.apk
          git commit -m "Nieuwe Android-app (APK) ${{ github.run_number }}" || exit 0
          git pull --rebase
          git push
